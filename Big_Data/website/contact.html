<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="联系HTTPS演示网站，提供安全联系方式">
    <title>联系我们 - HTTPS演示网站</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">🔒 HTTPS演示</div>
            <ul>
                <li><a href="index.html">首页</a></li>
                <li><a href="about.html">关于</a></li>
                <li><a href="contact.html" class="active">联系</a></li>
            </ul>
        </nav>
    </header>
    
    <main>
        <section class="contact-content">
            <div class="contact-info">
                <h1>联系我们</h1>
                <p>如果您对这个HTTPS演示网站有任何问题或建议，请通过以下方式联系我们。</p>
                
                <div class="contact-details">
                    <h2>联系信息</h2>
                    <div class="contact-item">
                        <span>📧 邮箱：</span>
                        <span>security@example.com</span>
                    </div>
                    <div class="contact-item">
                        <span>🌐 网站：</span>
                        <span>https://localhost</span>
                    </div>
                    <div class="contact-item">
                        <span>🔒 安全状态：</span>
                        <span>HTTPS加密连接</span>
                    </div>
                </div>
                
                <div class="security-notice">
                    <h3>🔐 安全传输保证</h3>
                    <p>所有通过此页面提交的数据都将通过TLS 1.3加密传输，确保您的信息安全。</p>
                    <ul>
                        <li>端到端加密保护</li>
                        <li>防止中间人攻击</li>
                        <li>数据完整性验证</li>
                    </ul>
                </div>
            </div>
            
            <div class="contact-form">
                <form id="contact-form">
                    <h2>发送安全消息</h2>
                    <div class="form-group">
                        <label for="name">姓名：</label>
                        <input type="text" id="name" name="name" required placeholder="请输入您的姓名">
                    </div>
                    <div class="form-group">
                        <label for="email">邮箱：</label>
                        <input type="email" id="email" name="email" required placeholder="请输入您的邮箱地址">
                    </div>
                    <div class="form-group">
                        <label for="subject">主题：</label>
                        <input type="text" id="subject" name="subject" required placeholder="请输入消息主题">
                    </div>
                    <div class="form-group">
                        <label for="message">消息内容：</label>
                        <textarea id="message" name="message" rows="6" required placeholder="请输入您要发送的消息内容"></textarea>
                    </div>
                    <button type="submit" class="btn">🔒 安全发送消息</button>
                    <div id="form-security-status">
                        <span class="security-icon">✅</span>
                        <span>连接安全 - 消息将通过HTTPS加密传输</span>
                    </div>
                </form>
            </div>
        </section>
    </main>
    
    <footer>
        <p>&copy; 2024 HTTPS演示网站 - 使用Nginx配置</p>
    </footer>
    
    <script src="js/script.js"></script>
</body>
</html>
