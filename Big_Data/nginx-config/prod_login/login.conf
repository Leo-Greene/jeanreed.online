server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name www.jeanreed.online;
    
    # 引入ACME配置
    include /etc/nginx/snippets/acme-challenge.conf;

    # 重定向到HTTPS
    return 301 https://www.jeanreed.online$request_uri;

}

server {
    listen 443 ssl http2 default_server;
    server_name www.jeanreed.online;
    
    # ssl_certificate /etc/ssl/certs/www.jeanreed.online.crt;
    # ssl_certificate_key /etc/ssl/private/www.jeanreed.online.key;
    include /etc/nginx/snippets/ssl-params.conf;

    root /var/www/html;
    index index.html index.htm;
    
    access_log /var/log/nginx/my-website.access.log;
    error_log /var/log/nginx/my-website.error.log;
    
    # Frontend (Static Files)
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # Backend API Proxy
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # CORS headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With' always;
        
        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    # Static files for Django admin
    location /static/ {
        proxy_pass http://backend:8000;
    }

    # Media files
    location /media/ {
        proxy_pass http://backend:8000;
    }
    
    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # # Security headers
    # add_header X-Frame-Options "SAMEORIGIN" always;
    # add_header X-Content-Type-Options "nosniff" always;
    # add_header X-XSS-Protection "1; mode=block" always;
    # add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # HTTPS端也包含ACME配置
    include /etc/nginx/snippets/acme-challenge.conf;
}